<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F4C3A">

  <!-- 🔒 Content Security Policy — relaxed (inline handlers/scripts aún permitidos, se irán eliminando) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; media-src 'self' https: data: blob:; connect-src 'self' https://api.aladhan.com https://api.alquran.cloud https://cdn.islamic.network https://api.mymemory.translated.net https://nominatim.openstreetmap.org https://ummahapi.com https://lingva.ml https://libretranslate.com https://libretranslate.de; manifest-src 'self'; worker-src 'self';">

  <!-- 🌐 Detección temprana de idioma (antes de que scripts corran) -->
  <script>
    (function(){
      try {
        var s = JSON.parse(localStorage.getItem('quba_settings') || '{}');
        var lang = s.locale || (navigator.language || 'es').slice(0,2);
        if (['es','ar','en'].indexOf(lang) < 0) lang = 'es';
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      } catch(e){}
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Quba — Tu compañero espiritual islámico: Corán con tafsir, oración, Qibla, calendario hijri, quiz gamificado">

  <title>Quba — Tu compañero espiritual</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/wisdom.css">
  <link rel="stylesheet" href="css/courses.css">
  <link rel="stylesheet" href="css/quran-reader.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome (con SRI para integridad) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">
</head>
<body>
  <!-- 🌟 Splash Screen — Animated Quba dome logo -->
  <div id="splash" class="splash">
    <div class="splash-bg-pattern"></div>
    <div class="splash-content">
      <div class="splash-logo-wrap">
        <!-- Glow behind dome -->
        <div class="splash-glow"></div>

        <!-- Animated SVG dome (draws itself + fills gold) -->
        <svg class="splash-dome-svg" viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#F4D678"/>
              <stop offset="55%" stop-color="#D4AF37"/>
              <stop offset="100%" stop-color="#9E7B1A"/>
            </linearGradient>
            <linearGradient id="domeBase" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1A6B52"/>
              <stop offset="100%" stop-color="#0F4C3A"/>
            </linearGradient>
          </defs>

          <!-- Finial (top spike) -->
          <line class="dome-finial" x1="150" y1="20" x2="150" y2="48" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
          <circle class="dome-finial-ball" cx="150" cy="52" r="6" fill="url(#goldGrad)"/>

          <!-- Main dome body (half-circle) -->
          <path class="dome-body" d="M 40 200 A 110 110 0 0 1 260 200 Z" fill="url(#domeBase)" stroke="url(#goldGrad)" stroke-width="3"/>

          <!-- Vertical golden ribs (8 lines that draw themselves) -->
          <path class="dome-rib" d="M 150 60 L 150 200"/>
          <path class="dome-rib" d="M 110 62 Q 108 130 100 200"/>
          <path class="dome-rib" d="M 190 62 Q 192 130 200 200"/>
          <path class="dome-rib" d="M 78 78 Q 68 140 62 200"/>
          <path class="dome-rib" d="M 222 78 Q 232 140 238 200"/>
          <path class="dome-rib" d="M 130 60 Q 126 130 124 200"/>
          <path class="dome-rib" d="M 170 60 Q 174 130 176 200"/>
          <path class="dome-rib" d="M 55 100 Q 45 150 42 200"/>
          <path class="dome-rib" d="M 245 100 Q 255 150 258 200"/>

          <!-- Base line -->
          <line class="dome-base" x1="36" y1="200" x2="264" y2="200" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 class="splash-title">Quba</h1>
      <p class="splash-tagline" data-i18n="tagline">Tu compañero espiritual</p>
      <div class="splash-loader"><div class="splash-loader-fill"></div></div>
    </div>
  </div>

  <!-- App Container -->
  <div id="app" class="app hidden">
    <main id="main-content" class="main-content"></main>

    <nav class="bottom-tabs">
      <button class="tab active" data-page="home">
        <i class="fas fa-home"></i>
        <span data-i18n="tabHome">Inicio</span>
      </button>
      <button class="tab" data-page="quran">
        <i class="fas fa-book-quran"></i>
        <span data-i18n="tabQuran">Corán</span>
      </button>
      <button class="tab" data-page="prayer">
        <i class="fas fa-mosque"></i>
        <span data-i18n="tabPrayer">Oración</span>
      </button>
      <button class="tab" data-page="wisdom">
        <i class="fas fa-lightbulb"></i>
        <span data-i18n="tabWisdom">Sabiduría</span>
      </button>
      <button class="tab" data-page="profile">
        <i class="fas fa-user"></i>
        <span data-i18n="tabProfile">Yo</span>
      </button>
    </nav>
  </div>

  <audio id="audio-player" preload="none"></audio>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Core scripts -->
  <script src="js/version.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cache-db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/qibla.js"></script>
  <script src="js/duas.js"></script>
  <script src="js/hijri.js"></script>

  <!-- v3: Quran helpers + Tafsir -->
  <script src="js/quran-helpers.js"></script>
  <script src="js/tafsir.js"></script>
  <script src="js/adhan.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/wake-lock.js"></script>
  <script src="js/pwa-install.js"></script>
  <script src="js/event-delegation.js"></script>

  <!-- Phase 2: Quiz data -->
  <script src="data/quiz/quran.js"></script>
  <script src="data/quiz/sira.js"></script>
  <script src="data/quiz/hadith.js"></script>
  <script src="data/quiz/fiqh.js"></script>
  <script src="data/quiz/history.js"></script>
  <script src="data/quiz/prophets.js"></script>

  <!-- v11: Local Vetted Du'as Dataset (Hisnul Muslim) -->
  <script src="data/duas/local_duas.js"></script>

  <!-- Phase 2: Adhkar data -->
  <script src="data/adhkar/morning.js"></script>
  <script src="data/adhkar/evening.js"></script>
  <script src="data/adhkar/sleep.js"></script>
  <script src="data/adhkar/after_prayer.js"></script>

  <!-- Phase 2: Courses data -->
  <script src="data/courses/how_to_pray.js"></script>
  <script src="data/courses/pillars.js"></script>
  <script src="data/courses/names_of_allah.js"></script>
  <!-- v7 interactive courses -->
  <script src="data/courses/journey.js"></script>
  <script src="data/courses/kids.js"></script>
  <script src="data/courses/quran_basics.js"></script>
  <script src="data/courses/salah_complete.js"></script>
  <script src="data/courses/wudu_complete.js"></script>
  <script src="js/mascot.js"></script>
  <script src="data/famous_verses.js"></script>
  <script src="data/calendar2026.js"></script>

  <!-- Phase 2: Gamification -->
  <script src="js/gamification.js"></script>

  <!-- Pages -->
  <script src="pages/home.js"></script>
  <script src="pages/quran.js"></script>
  <script src="pages/prayer.js"></script>
  <script src="pages/calendar.js"></script>
  <script src="pages/profile.js"></script>

  <!-- Phase 2: Wisdom subpages -->
  <script src="pages/wisdom/quiz.js"></script>
  <script src="pages/wisdom/tasbih.js"></script>
  <script src="pages/wisdom/adhkar.js"></script>
  <script src="pages/wisdom/courses.js"></script>
  <script src="pages/wisdom/duas.js"></script>
  <script src="pages/wisdom.js"></script>

  <!-- App core -->
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW error:', err));
      });
    }
  </script>
</body>
</html>
